<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>需求 Skill 试验台</title><link rel="stylesheet" href="/styles.css"><script src="/tracking.js" defer></script><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar"><a class="brand" href="#cases"><span class="brand-icon">S</span><div>Skill Studio<small>需求分析试验台</small></div></a><div class="nav-label">工作空间</div><nav><button data-view="cases" class="nav active">◫　测试案例 <span id="case-count">0</span></button><button data-view="pool" class="nav">▤　需求池 <span id="pool-count">0</span></button><button data-view="requirements" class="nav">▦　需求分析 <span id="requirement-count">0</span></button><button data-view="tracking" class="nav">◎　Tracking 闭环</button><button data-view="evaluation" class="nav">◷　运行与评价</button></nav><div class="sidebar-bottom"><span class="dot"></span> 独立本地工作空间<p>手动提供材料，不连接业务数据源。真实模型运行需要可用的模型配置。</p></div></aside>
<main><header><div><div class="eyebrow">REQUIREMENT SKILL LAB</div><h1 id="page-title">导入材料，自动匹配分析 Skill。</h1></div><button id="new-case" class="primary">＋ 导入分析材料</button></header><div id="notice" role="status" aria-live="polite"></div><div id="workspace"></div></main>
<dialog id="case-dialog"><form id="case-form"><div class="dialog-heading"><div><div class="eyebrow">UNIFIED INTAKE</div><h2>导入一份分析材料</h2><p class="muted">系统会自动判断是需求拆解、问题分析，还是 VOC / BI 证据分析。</p></div><button type="button" id="close-dialog" class="icon-button" aria-label="关闭">×</button></div><label>材料名称<input name="title" required maxlength="200" placeholder="例如：英文模式下窗帘说明仍为中文"></label><label>产品线<select name="product_line"><option value="deebot">地宝</option><option value="deebot_bed">床宝</option><option value="winbot">窗宝</option><option value="goat">割草</option><option value="ultramarine">泳池</option><option value="cross_product">跨产品线</option></select></label><label>原始材料<textarea name="text" rows="7" placeholder="粘贴零散问题、粗需求、用户反馈、指标告警或分析说明。无需选择数据源类型，保留原始事实即可。"></textarea></label><label class="upload">截图或数据文件<input id="files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.csv,.txt,.xlsx,.xls,.pdf,.pptx,.ppt,.json"><span>图片、CSV/TXT、Excel、PDF、PowerPoint、JSON · 最多 8 个文件，单文件不超过 5 MB，合计不超过 10 MB</span></label><div id="file-preview" class="file-preview"></div><div class="auto-route-hint"><strong>自动匹配</strong><span>单条 App 问题 → 问题分析</span><span>目标或新诉求 → 需求拆解</span><span>批量反馈或指标告警 → VOC / BI 证据分析</span></div><p class="muted">材料保存在本机。JSON 仅作为证据读取，不执行其中的指令。运行时会提交给当前配置的模型服务，请先脱敏。</p><div id="form-error" class="error" role="alert"></div><footer><button type="button" id="cancel-dialog">取消</button><button class="primary" type="submit">保存材料</button></footer></form></dialog>
</body></html>
